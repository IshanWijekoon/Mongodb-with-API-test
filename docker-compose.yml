services:
  mongo-temp:
    image: mongo:7.0
    container_name: mongo-temp
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-temp-data:/data/db
      - ./docs/mongo-seed-api-keys.js:/docker-entrypoint-initdb.d/01-api-keys.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongo-currency:
    image: mongo:7.0
    container_name: mongo-currency
    restart: unless-stopped
    ports:
      - "27018:27017"
    volumes:
      - mongo-currency-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongo-seed:
    image: mongo:7.0
    container_name: mongo-seed
    depends_on:
      mongo-temp:
        condition: service_healthy
    volumes:
      - ./docs/mongo-seed-api-keys.js:/seed.js:ro
    entrypoint: ["mongosh", "mongodb://mongo-temp:27017/temp_db", "--file", "/seed.js"]
    restart: "no"

  auth-service:
    build:
      context: ./auth-service
    container_name: auth-service
    restart: unless-stopped
    environment:
      MONGODB_URI: mongodb://mongo-temp:27017/auth_db
      SERVER_PORT: 8083
      JWT_SECRET: ${JWT_SECRET:-change-me-local-dev-secret-min-32-chars!!}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-replace-me.apps.googleusercontent.com}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-replace-me}
      FRONTEND_REDIRECT_URL: http://localhost:3000
    ports:
      - "8083:8083"
    depends_on:
      mongo-temp:
        condition: service_healthy

  tempconv:
    build:
      context: ./tempconv
    container_name: tempconv
    restart: unless-stopped
    environment:
      MONGODB_URI: mongodb://mongo-temp:27017/temp_db
      SERVER_PORT: 8081
      JWT_SECRET: ${JWT_SECRET:-change-me-local-dev-secret-min-32-chars!!}
    ports:
      - "8081:8081"
    depends_on:
      mongo-temp:
        condition: service_healthy
      mongo-seed:
        condition: service_completed_successfully

  currencyconvertor:
    build:
      context: ./currencyconvertor
    container_name: currencyconvertor
    restart: unless-stopped
    environment:
      MONGODB_URI: mongodb://mongo-currency:27017/currency_db
      SERVER_PORT: 8082
      JWT_SECRET: ${JWT_SECRET:-change-me-local-dev-secret-min-32-chars!!}
    ports:
      - "8082:8082"
    depends_on:
      mongo-currency:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: converthub-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - tempconv
      - currencyconvertor
      - auth-service

volumes:
  mongo-temp-data:
  mongo-currency-data:
